<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" role="img" aria-label="สเกลค่า pH ตั้งแต่ 0 ถึง 14 ช่วงกรด กลาง และเบส พร้อมตัวอย่างสารในชีวิตประจำวัน">
  <defs>
    <linearGradient id="ph" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#DC2626"/><stop offset=".18" stop-color="#F97316"/><stop offset=".34" stop-color="#FACC15"/>
      <stop offset=".5" stop-color="#22C55E"/><stop offset=".68" stop-color="#14B8A6"/><stop offset=".84" stop-color="#3B82F6"/><stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  <rect width="480" height="440" rx="22" fill="#FFFFFF"/>
  <g font-family="Prompt, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, sans-serif" text-anchor="middle">
    <text x="90" y="42" font-size="28" font-weight="800" fill="#B91C1C">กรด</text>
    <text x="240" y="42" font-size="28" font-weight="800" fill="#15803D">กลาง</text>
    <text x="390" y="42" font-size="28" font-weight="800" fill="#1D4ED8">เบส</text>
    <path d="M20 58H190" stroke="#B91C1C" stroke-width="5" stroke-linecap="round"/>
    <path d="M205 58H275" stroke="#15803D" stroke-width="5" stroke-linecap="round"/>
    <path d="M290 58H460" stroke="#1D4ED8" stroke-width="5" stroke-linecap="round"/>
    <rect x="20" y="78" width="440" height="44" rx="22" fill="url(#ph)" stroke="#0F172A" stroke-opacity=".28" stroke-width="2"/>
    <g font-size="21" font-weight="700" fill="#0F172A">
      <text x="20" y="152">0</text><text x="80" y="152">2</text><text x="140" y="152">4</text><text x="200" y="152">6</text>
      <text x="240" y="154" font-size="26" font-weight="800">7</text>
      <text x="280" y="152">8</text><text x="340" y="152">10</text><text x="400" y="152">12</text><text x="460" y="152">14</text>
    </g>
    <!-- ตัวอย่างสาร -->
    <g font-size="22" font-weight="700" text-anchor="start" fill="#1E293B">
      <circle cx="46" cy="214" r="11" fill="#EF4444"/><text x="70" y="222">น้ำมะนาว</text><text x="430" y="222" text-anchor="end" fill="#B91C1C">pH ≈ 2</text>
      <circle cx="46" cy="262" r="11" fill="#F59E0B"/><text x="70" y="270">กาแฟ</text><text x="430" y="270" text-anchor="end" fill="#B45309">pH ≈ 5</text>
      <circle cx="46" cy="310" r="11" fill="#22C55E"/><text x="70" y="318">น้ำบริสุทธิ์</text><text x="430" y="318" text-anchor="end" fill="#15803D">pH = 7</text>
      <circle cx="46" cy="358" r="11" fill="#3B82F6"/><text x="70" y="366">น้ำสบู่</text><text x="430" y="366" text-anchor="end" fill="#1D4ED8">pH ≈ 10</text>
      <circle cx="46" cy="406" r="11" fill="#6D28D9"/><text x="70" y="414">น้ำปูนใส</text><text x="430" y="414" text-anchor="end" fill="#4338CA">pH ≈ 12</text>
    </g>
    <g stroke="#E2E8F0" stroke-width="2"><path d="M20 238H460"/><path d="M20 286H460"/><path d="M20 334H460"/><path d="M20 382H460"/></g>
  </g>
</svg>
