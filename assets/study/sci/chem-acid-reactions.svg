<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" role="img" aria-label="ปฏิกิริยาของกรด กรดกับเบสได้เกลือและน้ำ กรดกับโลหะได้เกลือและแก๊สไฮโดรเจน กรดกับหินปูนได้เกลือ น้ำ และแก๊สคาร์บอนไดออกไซด์">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect width="480" height="420" rx="22" fill="#FFFFFF"/>
  <g font-family="Prompt, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, sans-serif" text-anchor="middle">
    <text x="240" y="40" font-size="26" font-weight="800" fill="#B91C1C">ปฏิกิริยาของกรด</text>

    <rect x="20" y="64" width="190" height="84" rx="16" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
    <text x="115" y="100" font-size="22" font-weight="800" fill="#991B1B">กรด + เบส</text>
    <text x="115" y="128" font-size="17" font-weight="700" fill="#991B1B">ปฏิกิริยาสะเทิน</text>
    <path d="M214 106H262" stroke="#475569" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ar)"/>
    <rect x="270" y="64" width="190" height="84" rx="16" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/>
    <text x="365" y="102" font-size="22" font-weight="800" fill="#0F172A">เกลือ + น้ำ</text>

    <rect x="20" y="168" width="190" height="84" rx="16" fill="#FFEDD5" stroke="#EA580C" stroke-width="2.5"/>
    <text x="115" y="204" font-size="22" font-weight="800" fill="#9A3412">กรด + โลหะ</text>
    <text x="115" y="232" font-size="17" font-weight="700" fill="#9A3412">โลหะผุกร่อน</text>
    <path d="M214 210H262" stroke="#475569" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ar)"/>
    <rect x="270" y="168" width="190" height="84" rx="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
    <text x="365" y="200" font-size="20" font-weight="800" fill="#0F172A">เกลือ + แก๊ส</text>
    <text x="365" y="230" font-size="24" font-weight="800" fill="#1D4ED8">H2</text>

    <rect x="20" y="272" width="190" height="84" rx="16" fill="#FEF9C3" stroke="#CA8A04" stroke-width="2.5"/>
    <text x="115" y="308" font-size="22" font-weight="800" fill="#854D0E">กรด + หินปูน</text>
    <text x="115" y="336" font-size="17" font-weight="700" fill="#854D0E">CaCO3</text>
    <path d="M214 314H262" stroke="#475569" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ar)"/>
    <rect x="270" y="272" width="190" height="84" rx="16" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/>
    <text x="365" y="302" font-size="20" font-weight="800" fill="#0F172A">เกลือ + น้ำ + แก๊ส</text>
    <text x="365" y="334" font-size="24" font-weight="800" fill="#15803D">CO2</text>

    <text x="240" y="394" font-size="19" font-weight="800" fill="#B91C1C">โลหะ → H2 ,  หินปูน → CO2</text>
  </g>
</svg>
