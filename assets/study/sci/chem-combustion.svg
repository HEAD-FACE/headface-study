    <rect x="240" y="78" width="212" height="82" rx="14" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <text x="346" y="118" font-size="20" font-weight="800" fill="#0F172A" text-anchor="middle">CO<tspan baseline-shift="sub" font-size="70%">2</tspan> + H<tspan baseline-shift="sub" font-size="70%">2</tspan>O</text><text x="346" y="144" font-size="16" font-weight="700" fill="#0369A1" text-anchor="middle">+ พลังงานมาก</text>
    <text x="346" y="190" font-size="17" font-weight="700" fill="#0C4A6E" text-anchor="middle">เปลวสีฟ้า ไม่มีเขม่า</text>
