<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 416" role="img" aria-label="เปรียบเทียบการเผาไหม้ การเผาไหม้สมบูรณ์เปลวไฟสีฟ้า ออกซิเจนพอ ได้คาร์บอนไดออกไซด์กับน้ำ ส่วนการเผาไหม้ไม่สมบูรณ์เปลวไฟสีเหลืองส้ม ออกซิเจนไม่พอ ได้คาร์บอนมอนอกไซด์ น้ำ และเขม่า">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="480" height="416" rx="22" fill="#FFFFFF"/>
  <g font-family="Prompt, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, sans-serif" text-anchor="middle">

