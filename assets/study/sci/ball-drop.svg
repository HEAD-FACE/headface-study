<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-label="ลูกบอลตกจากที่สูง: ด้านบนมีพลังงานศักย์มากที่สุด ระหว่างตกพลังงานศักย์ลดลงและพลังงานจลน์เพิ่มขึ้น ด้านล่างมีพลังงานจลน์มากที่สุด">
  <rect width="480" height="400" rx="22" fill="#FFFFFF"/>
  <g font-family="Prompt, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, sans-serif">
    <path d="M30 340H450" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <text x="30" y="372" font-size="17" font-weight="600" fill="#475569">พื้น</text>
    <!-- ตำแหน่งที่ 1: บนสุด -->
    <circle cx="62" cy="52" r="20" fill="#F97316" stroke="#9A3412" stroke-width="4"/>
    <text x="104" y="40" font-size="19" font-weight="800" fill="#1D4ED8">ศักย์มาก</text>
    <rect x="104" y="50" width="220" height="22" rx="8" fill="#2563EB"/>
    <text x="336" y="68" font-size="17" font-weight="600" fill="#475569">จลน์ ≈ 0</text>
    <!-- ตำแหน่งที่ 2: กลาง -->
    <circle cx="62" cy="168" r="20" fill="#F97316" stroke="#9A3412" stroke-width="4" opacity=".78"/>
    <text x="104" y="156" font-size="19" font-weight="800" fill="#334155">ศักย์ + จลน์</text>
    <rect x="104" y="166" width="110" height="22" rx="8" fill="#2563EB"/><rect x="214" y="166" width="110" height="22" rx="8" fill="#F97316"/>
    <!-- ตำแหน่งที่ 3: ล่างสุด -->
    <circle cx="62" cy="298" r="20" fill="#F97316" stroke="#9A3412" stroke-width="4" opacity=".58"/>
    <text x="104" y="268" font-size="19" font-weight="800" fill="#C2410C">จลน์มาก</text>
    <rect x="104" y="278" width="220" height="22" rx="8" fill="#F97316"/>
    <text x="336" y="296" font-size="17" font-weight="600" fill="#475569">ศักย์ ≈ 0</text>
    <path d="M62 78V138" stroke="#9A3412" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
    <path d="M62 194V268" stroke="#9A3412" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
    <text x="240" y="392" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">ศักย์ + จลน์ = คงที่ (ไม่คิดแรงต้านอากาศ)</text>
  </g>
</svg>
