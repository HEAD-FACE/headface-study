    <text x="450" y="222" font-size="17" font-weight="700" fill="#1E3A8A" text-anchor="end">AB → A + B</text>
    <g transform="translate(-52 0)"><circle cx="200" cy="264" r="14" fill="#EF4444" stroke="#fff" stroke-width="2"/><text x="200" y="269" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">A</text><circle cx="228" cy="264" r="14" fill="#3B82F6" stroke="#fff" stroke-width="2"/><text x="228" y="269" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">B</text><path d="M258 264H304" stroke="#475569" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ar)"/><circle cx="336" cy="264" r="14" fill="#EF4444" stroke="#fff" stroke-width="2"/><text x="336" y="269" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">A</text><text x="366" y="271" font-size="22" font-weight="800" fill="#475569" text-anchor="middle">+</text><circle cx="398" cy="264" r="14" fill="#3B82F6" stroke="#fff" stroke-width="2"/><text x="398" y="269" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">B</text></g>
    <rect x="14" y="306" width="452" height="110" rx="16" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/>
    <text x="30" y="344" font-size="21" font-weight="800" fill="#14532D" text-anchor="start">3. การแทนที่เดี่ยว</text>
    <text x="450" y="344" font-size="17" font-weight="700" fill="#14532D" text-anchor="end">A + BC → AC + B</text>
    <g transform="translate(-66 0)"><circle cx="192" cy="386" r="14" fill="#EF4444" stroke="#fff" stroke-width="2"/><text x="192" y="391" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">A</text><text x="222" y="393" font-size="22" font-weight="800" fill="#475569" text-anchor="middle">+</text><circle cx="250" cy="386" r="14" fill="#3B82F6" stroke="#fff" stroke-width="2"/><text x="250" y="391" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">B</text><circle cx="278" cy="386" r="14" fill="#22C55E" stroke="#fff" stroke-width="2"/><text x="278" y="391" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">C</text><path d="M304 386H334" stroke="#475569" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ar)"/><circle cx="358" cy="386" r="14" fill="#EF4444" stroke="#fff" stroke-width="2"/><text x="358" y="391" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">A</text><circle cx="386" cy="386" r="14" fill="#22C55E" stroke="#fff" stroke-width="2"/><text x="386" y="391" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">C</text><text x="414" y="393" font-size="22" font-weight="800" fill="#475569" text-anchor="middle">+</text><circle cx="442" cy="386" r="14" fill="#3B82F6" stroke="#fff" stroke-width="2"/><text x="442" y="391" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">B</text></g>
    <rect x="14" y="428" width="452" height="110" rx="16" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
    <text x="30" y="466" font-size="21" font-weight="800" fill="#78350F" text-anchor="start">4. การแทนที่คู่</text>
    <text x="450" y="466" font-size="17" font-weight="700" fill="#78350F" text-anchor="end">AB + CD → AD + CB</text>
    <g transform="translate(-86 0)"><circle cx="180" cy="508" r="14" fill="#EF4444" stroke="#fff" stroke-width="2"/><text x="180" y="513" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">A</text><circle cx="208" cy="508" r="14" fill="#3B82F6" stroke="#fff" stroke-width="2"/><text x="208" y="513" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">B</text><text x="236" y="515" font-size="22" font-weight="800" fill="#475569" text-anchor="middle">+</text><circle cx="264" cy="508" r="14" fill="#22C55E" stroke="#fff" stroke-width="2"/><text x="264" y="513" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">C</text><circle cx="292" cy="508" r="14" fill="#F59E0B" stroke="#fff" stroke-width="2"/><text x="292" y="513" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">D</text><path d="M316 508H342" stroke="#475569" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ar)"/><circle cx="368" cy="508" r="14" fill="#EF4444" stroke="#fff" stroke-width="2"/><text x="368" y="513" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">A</text><circle cx="396" cy="508" r="14" fill="#F59E0B" stroke="#fff" stroke-width="2"/><text x="396" y="513" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">D</text><text x="424" y="515" font-size="22" font-weight="800" fill="#475569" text-anchor="middle">+</text><circle cx="452" cy="508" r="14" fill="#22C55E" stroke="#fff" stroke-width="2"/><text x="452" y="513" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">C</text><circle cx="480" cy="508" r="14" fill="#3B82F6" stroke="#fff" stroke-width="2"/><text x="480" y="513" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">B</text></g>

  </g>
</svg>
