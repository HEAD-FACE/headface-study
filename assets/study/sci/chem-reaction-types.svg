<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" role="img" aria-label="ปฏิกิริยาเคมี 4 ประเภทแสดงด้วยวงกลมสี การรวมตัว A กับ B รวมเป็น AB การแยกสลาย AB แยกเป็น A กับ B การแทนที่เดี่ยว A ไปแทนที่ B ใน BC การแทนที่คู่ AB กับ CD สลับคู่กัน">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="480" height="560" rx="22" fill="#FFFFFF"/>
  <g font-family="Prompt, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, sans-serif" text-anchor="middle">
<text x="240" y="40" font-size="25" font-weight="800" fill="#0F172A" text-anchor="middle">4 ประเภทของปฏิกิริยาเคมี</text>    <rect x="14" y="62" width="452" height="110" rx="16" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
    <text x="30" y="100" font-size="21" font-weight="800" fill="#991B1B" text-anchor="start">1. การรวมตัว</text>
    <text x="450" y="100" font-size="17" font-weight="700" fill="#991B1B" text-anchor="end">A + B → AB</text>
    <g transform="translate(-52 0)"><circle cx="200" cy="142" r="14" fill="#EF4444" stroke="#fff" stroke-width="2"/><text x="200" y="147" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">A</text><text x="232" y="149" font-size="22" font-weight="800" fill="#475569" text-anchor="middle">+</text><circle cx="264" cy="142" r="14" fill="#3B82F6" stroke="#fff" stroke-width="2"/><text x="264" y="147" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">B</text><path d="M292 142H338" stroke="#475569" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ar)"/><circle cx="370" cy="142" r="14" fill="#EF4444" stroke="#fff" stroke-width="2"/><text x="370" y="147" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">A</text><circle cx="398" cy="142" r="14" fill="#3B82F6" stroke="#fff" stroke-width="2"/><text x="398" y="147" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">B</text></g>
    <rect x="14" y="184" width="452" height="110" rx="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
