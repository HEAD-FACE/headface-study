<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" role="img" aria-label="การสังเคราะห์ด้วยแสง พืชรับคาร์บอนไดออกไซด์และน้ำ ใช้พลังงานแสงและคลอโรฟิลล์ เปลี่ยนเป็นน้ำตาลกลูโคสและแก๊สออกซิเจน">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="480" height="440" rx="22" fill="#FFFFFF"/>
  <g font-family="Prompt, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, sans-serif" text-anchor="middle">
<text x="240" y="38" font-size="24" font-weight="800" fill="#0F172A" text-anchor="middle">การสังเคราะห์ด้วยแสง</text>
    <g transform="translate(400 70)"><circle r="30" fill="#FBBF24"/><line x1="40" y1="0" x2="54" y2="0" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" transform="rotate(0)"/><line x1="40" y1="0" x2="54" y2="0" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" transform="rotate(45)"/><line x1="40" y1="0" x2="54" y2="0" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" transform="rotate(90)"/><line x1="40" y1="0" x2="54" y2="0" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" transform="rotate(135)"/><line x1="40" y1="0" x2="54" y2="0" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" transform="rotate(180)"/><line x1="40" y1="0" x2="54" y2="0" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" transform="rotate(225)"/><line x1="40" y1="0" x2="54" y2="0" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" transform="rotate(270)"/><line x1="40" y1="0" x2="54" y2="0" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" transform="rotate(315)"/></g><text x="334" y="76" font-size="18" font-weight="800" fill="#B45309" text-anchor="middle">แสงแดด</text>
    <rect x="16" y="130" width="130" height="74" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="81" y="164" font-size="22" font-weight="800" fill="#0F172A" text-anchor="middle">6CO<tspan baseline-shift="sub" font-size="70%">2</tspan></text><text x="81" y="188" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">คาร์บอนไดออกไซด์</text>
    <rect x="16" y="224" width="130" height="74" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="81" y="258" font-size="22" font-weight="800" fill="#1E3A8A" text-anchor="middle">6H<tspan baseline-shift="sub" font-size="70%">2</tspan>O</text><text x="81" y="282" font-size="15" font-weight="700" fill="#1E3A8A" text-anchor="middle">น้ำ</text>
    <path d="M150 168L168 190M150 262L168 244" stroke="#475569" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ar)"/>
    <g transform="translate(240 220)"><path d="M0 -70C60 -60 84 -10 70 40C20 62 -50 46 -70 0C-60 -40 -30 -66 0 -70Z" fill="#4ADE80" stroke="#15803D" stroke-width="4"/><path d="M-62 42C-30 14 10 -16 52 -44" stroke="#15803D" stroke-width="4" fill="none" stroke-linecap="round"/></g>
    <text x="240" y="322" font-size="16" font-weight="800" fill="#15803D" text-anchor="middle">คลอโรฟิลล์ ดูดกลืนแสง</text>
    <path d="M318 190L338 168M318 244L338 262" stroke="#475569" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ar)"/>
    <rect x="340" y="130" width="130" height="74" rx="14" fill="#FCE7F3" stroke="#DB2777" stroke-width="2.5"/><text x="405" y="164" font-size="22" font-weight="800" fill="#9D174D" text-anchor="middle">C<tspan baseline-shift="sub" font-size="70%">6</tspan>H<tspan baseline-shift="sub" font-size="70%">12</tspan>O<tspan baseline-shift="sub" font-size="70%">6</tspan></text><text x="405" y="188" font-size="15" font-weight="700" fill="#9D174D" text-anchor="middle">น้ำตาล (อาหาร)</text>
    <rect x="340" y="224" width="130" height="74" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/><text x="405" y="258" font-size="22" font-weight="800" fill="#14532D" text-anchor="middle">6O<tspan baseline-shift="sub" font-size="70%">2</tspan></text><text x="405" y="282" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">ออกซิเจน</text>
    <rect x="40" y="350" width="400" height="74" rx="18" fill="#FEF9C3" stroke="#CA8A04" stroke-width="2.5"/>
    <text x="240" y="382" font-size="20" font-weight="800" fill="#713F12" text-anchor="middle">6CO<tspan baseline-shift="sub" font-size="70%">2</tspan> + 6H<tspan baseline-shift="sub" font-size="70%">2</tspan>O  → แสง →  C<tspan baseline-shift="sub" font-size="70%">6</tspan>H<tspan baseline-shift="sub" font-size="70%">12</tspan>O<tspan baseline-shift="sub" font-size="70%">6</tspan> + 6O<tspan baseline-shift="sub" font-size="70%">2</tspan></text>
    <text x="240" y="410" font-size="16" font-weight="700" fill="#854D0E" text-anchor="middle">ปฏิกิริยาดูดพลังงาน (พลังงานแสงถูกเก็บไว้ในน้ำตาล)</text>
  </g>
</svg>
