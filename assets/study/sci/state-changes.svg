<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" role="img" aria-label="แผนภาพการเปลี่ยนสถานะ: ของแข็ง ของเหลว แก๊ส และชื่อการเปลี่ยนสถานะแต่ละทิศทาง ลูกศรสีแดงคือรับความร้อน ลูกศรสีน้ำเงินคือคายความร้อน">
  <defs>
    <marker id="aR" markerWidth="8" markerHeight="8" refX="5.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8z" fill="#DC2626"/></marker>
    <marker id="aB" markerWidth="8" markerHeight="8" refX="5.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8z" fill="#2563EB"/></marker>
  </defs>
  <rect width="480" height="470" rx="22" fill="#FFFFFF"/>
  <g font-family="Prompt, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, sans-serif">
    <rect x="150" y="18" width="200" height="66" rx="18" fill="#ECFDF5" stroke="#10B981" stroke-width="4"/>
    <text x="250" y="62" text-anchor="middle" font-size="30" font-weight="800" fill="#047857">ของแข็ง</text>
    <rect x="150" y="190" width="200" height="66" rx="18" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="4"/>
    <text x="250" y="234" text-anchor="middle" font-size="30" font-weight="800" fill="#0369A1">ของเหลว</text>
    <rect x="150" y="362" width="200" height="66" rx="18" fill="#FFF7ED" stroke="#F97316" stroke-width="4"/>
    <text x="250" y="406" text-anchor="middle" font-size="30" font-weight="800" fill="#9A3412">แก๊ส</text>
    <!-- ของแข็ง ⇄ ของเหลว -->
    <path d="M205 90V182" stroke="#DC2626" stroke-width="5" stroke-linecap="round" marker-end="url(#aR)"/>
    <text x="192" y="142" text-anchor="end" font-size="20" font-weight="700" fill="#B91C1C">หลอมเหลว</text>
    <path d="M295 182V90" stroke="#2563EB" stroke-width="5" stroke-linecap="round" marker-end="url(#aB)"/>
    <text x="308" y="142" font-size="20" font-weight="700" fill="#1D4ED8">แข็งตัว</text>
    <!-- ของเหลว ⇄ แก๊ส -->
    <path d="M205 262V354" stroke="#DC2626" stroke-width="5" stroke-linecap="round" marker-end="url(#aR)"/>
    <text x="192" y="314" text-anchor="end" font-size="20" font-weight="700" fill="#B91C1C">กลายเป็นไอ</text>
    <path d="M295 354V262" stroke="#2563EB" stroke-width="5" stroke-linecap="round" marker-end="url(#aB)"/>
    <text x="308" y="314" font-size="20" font-weight="700" fill="#1D4ED8">ควบแน่น</text>
    <!-- ระเหิด: ของแข็ง → แก๊ส โดยตรง -->
    <path d="M146 51C34 51 34 395 142 395" stroke="#DC2626" stroke-width="5" stroke-linecap="round" fill="none" marker-end="url(#aR)"/>
    <text x="60" y="226" text-anchor="middle" font-size="20" font-weight="700" fill="#B91C1C" transform="rotate(-90 60 226)">ระเหิด</text>
    <!-- คำอธิบายสี -->
    <rect x="96" y="450" width="26" height="8" rx="4" fill="#DC2626"/>
    <text x="130" y="460" font-size="17" font-weight="600" fill="#334155">รับความร้อน</text>
    <rect x="270" y="450" width="26" height="8" rx="4" fill="#2563EB"/>
    <text x="304" y="460" font-size="17" font-weight="600" fill="#334155">คายความร้อน</text>
  </g>
</svg>
