<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0B0F19">
  <title>HEADFACE Study — ออฟไลน์</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 28px 20px;
      background: #0B0F19; color: #f1f5f9; font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif; text-align: center; }
    main { width: 100%; max-width: 360px; }
    .logo { width: 72px; height: 72px; margin: 0 auto 22px; border-radius: 20px; overflow: hidden; box-shadow: 0 0 40px -8px rgba(16, 185, 129, .55); }
    .logo img { width: 100%; height: 100%; display: block; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
    p { font-size: 15px; line-height: 1.7; color: #94a3b8; margin-bottom: 26px; }
    button { border: 0; border-radius: 14px; padding: 13px 28px; background: #10B981; color: #fff; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="logo"><img src="/assets/icons/icon-192.png" alt="HEADFACE Study" width="72" height="72"></div>
    <h1>ไม่มีสัญญาณอินเทอร์เน็ต</h1>
    <p>HEADFACE Study ต้องเชื่อมต่ออินเทอร์เน็ตเพื่อโหลดบทเรียนและความคืบหน้าล่าสุด ตรวจสอบสัญญาณแล้วลองใหม่อีกครั้ง</p>
    <button type="button" onclick="location.reload()">ลองใหม่</button>
  </main>
</body>
</html>
