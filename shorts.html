<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <!-- HEADFACE 4: opening schedule (js/launch.js of the main site). Production stays closed until the Study opening time -->
  <script>
    (function () {
      // study.<site> and beta-study.<site> load js/launch.js of their own main site (no address is written here: see test/env.test.mjs)
      var m = /^(beta-)?study\.(.+)$/.exec(location.hostname);
      if (!m) return;
      document.write('<script src="https://' + (m[1] ? 'beta.' : '') + m[2] + '/js/launch.js"><\/script>');
    })();
  </script>
  <!-- PWA: the HEADFACE Study app (manifest.webmanifest, sw.js, js/pwa.js): "Add to Home Screen" on Android and iOS -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#10B981">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Study">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <script src="/js/pwa.js" defer></script>
  <!-- ธีมสว่าง/มืด: ตั้ง data-theme ที่ <html> ก่อนวาดหน้า (ตรงกับเว็บหลัก) -->
  <script src="/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>HEADFACE Study - Shorts</title>

  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <!-- Stylesheet ร่วม + คลิปสอน (ฟีด Shorts เต็มจอ) -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/loading.css">
  <link rel="stylesheet" href="css/videos.css">
  <link rel="stylesheet" href="css/dark.css">
  <link rel="stylesheet" href="css/skins.css">
</head>
<body class="sh-page" data-page="shorts">

  <header class="sh-top">
    <a id="shBack" class="sh-back" href="videos.html" aria-label="กลับไปหน้าคลิปสอน"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6l6 6"/></svg></a>
    <div class="sh-top-t"><h1>Shorts</h1><p id="shSubject"></p></div>
    <span id="shQuota" class="sh-quota" hidden></span>
  </header>

  <!-- คลิปทีละจอ ปัดขึ้น/ลง: เล่นเมื่อค้างอยู่กลางจอ (js/study-shorts.js) ระหว่างรอเป็นจอว่างเท่านั้น -->
  <main id="shFeed" class="sh-feed" tabindex="-1" aria-label="ฟีด Shorts"><section class="sh-item" role="status" aria-busy="true"><span class="sr-only">กำลังโหลด Shorts</span></section></main>
  <p id="shToast" class="sh-toast" role="status" hidden></p>

  <!-- Scripts: ตรวจสิทธิ์ (Strict Route Guard เหมือนทุกหน้า) + ฟีด Shorts -->
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/api-client.js"></script>
  <script src="js/main.js"></script>
  <script type="module" src="js/study-shorts.js"></script>
</body>
</html>
