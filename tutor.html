<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <!-- HEADFACE 4: opening schedule (js/launch.js of the main site). Production stays closed until the Study opening time -->
  <script>
    (function () {
      // study.<site> and beta-study.<site> load js/launch.js of their own main site (no address is written here: see test/env.test.mjs)
      var m = /^(beta-)?study\.(.+)$/.exec(location.hostname);
      if (!m) return;
      document.write('<script src="https://' + (m[1] ? 'beta.' : '') + m[2] + '/js/launch.js"><\/script>');
    })();
  </script>
  <!-- PWA: the HEADFACE Study app (manifest.webmanifest, sw.js, js/pwa.js): "Add to Home Screen" on Android and iOS -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#10B981">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Study">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <script src="/js/pwa.js" defer></script>
  <!-- ธีมสว่าง/มืด: ตั้ง data-theme ที่ <html> ก่อนวาดหน้า (ตรงกับเว็บหลัก) -->
  <script src="/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>HEADFACE Study - AI Tutor</title>

  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <!-- Stylesheet ร่วม + สไตล์หน้ากลุ่มเรียน (ไม่ใช้ Tailwind ในหน้ากลุ่มนี้) + สไตล์ของ AI Tutor -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/flow.css">
  <link rel="stylesheet" href="css/loading.css">
  <link rel="stylesheet" href="css/tutor.css">
  <link rel="stylesheet" href="css/dark.css">
</head>
<body class="flow hue-emerald tutor-page" data-page="tutor">

  <!-- แถบหัวของหน้า (ปุ่มย้อนกลับ + ชื่อ + เครดิตที่เหลือ) -->
  <header class="fbar">
    <div class="fbar-in">
      <a id="backLink" class="fback" href="index.html" aria-label="กลับ"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6l6 6"/></svg></a>
      <div class="fbar-t">
        <p id="eyebrow" class="fbar-e">HEADFACE Study</p>
        <h1 id="pageTitle" class="fbar-h">คุยกับ AI Tutor</h1>
      </div>
      <div id="barRight"><span id="creditPill" class="tt-credit" hidden role="status" aria-label="เครดิต LYNX ที่เหลือวันนี้"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2L4 14h6l-1 8l9-12h-6z"/></svg><b id="creditValue">0</b></span></div>
    </div>
  </header>

  <main id="view" class="fmain tutor-main" tabindex="-1">
    <div id="content" class="fwrap tt-wrap">
      <!-- โครงเปล่าระหว่างรอสถานะจาก Backend (ไม่แสดงข้อมูลตัวอย่าง) -->
      <div class="sk-wrap" role="status" aria-live="polite" aria-busy="true"><span class="sr-only">กำลังโหลด...</span><i class="sk sk-card"></i><i class="sk sk-card s"></i></div>
    </div>
  </main>

  <!-- Scripts: ตรวจสิทธิ์ (Strict Route Guard เหมือนทุกหน้า) + หน้าคุย AI Tutor (ไม่โหลดแชทลอยของ LYNX: ซ้ำซ้อนและบังปุ่มคุม) -->
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/api-client.js"></script>
  <script src="js/main.js"></script>
  <script type="module" src="js/tutor-page.js"></script>
</body>
</html>
